name: VPS Deploy Status
on:
  workflow_dispatch:
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_UUID: et79n1zgjbtodtdsklnfn09d
    steps:
      - uses: actions/checkout@v4
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Status on VPS
        run: |
          SCRIPT_B64=$(base64 -w0 Unicoach/backend/scripts/coursefinder/coolify_status.sh)
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} \
            "echo '$SCRIPT_B64' | base64 -d > /tmp/cf_status.sh && APP_UUID='${APP_UUID}' bash /tmp/cf_status.sh; rm -f /tmp/cf_status.sh"
