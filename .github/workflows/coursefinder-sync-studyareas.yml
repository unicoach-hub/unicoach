name: CourseFinder Sync Study Areas (-> VPS Mongo)

# Ships the prebuilt cfId->studyAreaIds (studyareas.json.gz, ~100% coverage, derived from
# CF CategoryId) and applies it to the LIVE local VPS Mongo via the app container. No CF
# token needed. Pairs with the engine's study-area matching for broad-discipline parity.
# Secrets: VPS_SSH_KEY_B64, VPS_HOST.
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_UUID: et79n1zgjbtodtdsklnfn09d
    steps:
      - uses: actions/checkout@v4
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Ship + apply on VPS
        run: |
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            Unicoach/backend/scripts/coursefinder/studyareas.json.gz \
            root@${{ secrets.VPS_HOST }}:/tmp/studyareas.json.gz
          SCRIPT_B64=$(base64 -w0 Unicoach/backend/scripts/coursefinder/vps_apply_studyareas.sh)
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} \
            "echo '$SCRIPT_B64' | base64 -d > /tmp/vps_apply_sa.sh && APP_UUID='${APP_UUID}' bash /tmp/vps_apply_sa.sh; rm -f /tmp/vps_apply_sa.sh"
