name: VPS Coolify Fix
on:
  workflow_dispatch:
    inputs:
      do_fix:
        description: 'Update MONGO_URI to Atlas and redeploy (false = read-only probe)'
        type: boolean
        default: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_UUID: et79n1zgjbtodtdsklnfn09d
    steps:
      - uses: actions/checkout@v4
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Run Coolify fix on VPS
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DO_FIX: ${{ inputs.do_fix }}
        run: |
          SCRIPT_B64=$(base64 -w0 Unicoach/backend/scripts/coursefinder/coolify_fix.sh)
          MONGO_B64=$(printf '%s' "$MONGO_URI" | base64 -w0)
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} \
            "echo '$SCRIPT_B64' | base64 -d > /tmp/cf_fix.sh && APP_UUID='${APP_UUID}' MONGO_B64='${MONGO_B64}' DO_FIX='${DO_FIX}' bash /tmp/cf_fix.sh; rm -f /tmp/cf_fix.sh"
