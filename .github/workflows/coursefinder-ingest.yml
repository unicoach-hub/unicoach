name: CourseFinder Catalogue Ingest

# Harvests the full CourseFinder catalogue and loads it into MongoDB Atlas
# (cf_courses / cf_universities / cf_highlights / cf_countries — non-destructive).
# Runs on GitHub's hosted runner, which has a clean network path to Atlas
# (unlike corporate/DPI networks that reset the Mongo TLS handshake).
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   MONGO_URI  — your Atlas connection string (…/unicoach?…)
#   CF_CREDS   — JSON: {"token":"<CourseFinder bearer>","userId":"<uuid>"}
#                (grab from app.coursefinder.ai -> /api/auth/session while logged in; token is valid ~24h)
#
# Trigger: Actions tab -> "CourseFinder Catalogue Ingest" -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      slim:
        description: 'SLIM mode (drop heavy raw payload; needed for free 512MB M0)'
        type: boolean
        default: true
      reset:
        description: 'RESET (drop cf_* first). Leave OFF for a live site — upserts update in place with no search gap.'
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Unicoach/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mongodb driver
        run: npm i mongodb --no-audit --no-fund

      - name: Write CourseFinder credentials
        run: |
          mkdir -p scripts/coursefinder/.cfdata
          printf '%s' "$CF_CREDS" > scripts/coursefinder/.cfdata/.cf_creds.json
          node -e "const c=require('./scripts/coursefinder/.cfdata/.cf_creds.json'); if(!c.token||!c.userId){console.error('CF_CREDS missing token/userId');process.exit(1)} const p=JSON.parse(Buffer.from(c.token.split('.')[1],'base64')); console.log('token expires in (h):',((p.exp*1000-Date.now())/3600000).toFixed(1))"
        env:
          CF_CREDS: ${{ secrets.CF_CREDS }}

      - name: Harvest catalogue
        run: CF_DATA_DIR=./scripts/coursefinder/.cfdata node scripts/coursefinder/cf_harvest.js

      - name: Transform
        run: node --max-old-space-size=6144 scripts/coursefinder/cf_transform.js
        env:
          CF_DATA_DIR: ./scripts/coursefinder/.cfdata

      - name: Ingest into Atlas
        run: CF_OUT_DIR=./scripts/coursefinder/.cfdata/out node scripts/coursefinder/cf_ingest.js
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SLIM: ${{ inputs.slim && '1' || '0' }}
          RESET: ${{ inputs.reset && '1' || '0' }}

      - name: Verify
        run: |
          node -e "
          const { MongoClient } = require('mongodb');
          (async () => {
            const c = new MongoClient(process.env.MONGO_URI, { serverSelectionTimeoutMS: 20000 });
            await c.connect(); const db = c.db();
            const s = await db.stats();
            const courses = await db.collection('cf_courses').countDocuments();
            const unis = await db.collection('cf_universities').countDocuments();
            const uk = await db.collection('cf_courses').countDocuments({ cfCountryId: 4 });
            const scholarship = await db.collection('cf_courses').countDocuments({ highlightIds: 2 });
            const sample = await db.collection('cf_courses').findOne({ highlightIds: 2 }, { projection: { _id:0, courseName:1, universityName:1, countryName:1, annualFee:1 } });
            const withDisc = await db.collection('cf_courses').countDocuments({ disciplines: { \$exists: true, \$ne: [] } });
            const bterm = async (t) => { const rx = new RegExp(t, 'i'); return db.collection('cf_courses').countDocuments({ \$or: [{courseName: rx},{universityName: rx},{discipline: rx},{disciplines: rx}] }); };
            console.log('--- INGEST VERIFY ---');
            console.log('db dataSize MB:', (s.dataSize/1048576).toFixed(1), '/ 512');
            console.log('cf_courses:', courses, '| cf_universities:', unis);
            console.log('UK courses (cfCountryId=4):', uk, '| scholarship-available:', scholarship);
            console.log('disciplines coverage:', withDisc, '/', courses, '(' + (100*withDisc/courses).toFixed(1) + '%)');
            console.log('BROAD-TERM counts (name|uni|discipline|disciplines):');
            for (const t of ['Law','Nursing','Business','Data Science','Computer Science','Psychology']) console.log('  ', t, '=>', await bterm(t));
            console.log('sample scholarship course:', JSON.stringify(sample));
            if (s.dataSize/1048576 > 480) console.log('::warning::DB dataSize is close to the 512MB M0 cap — consider dropping legacy course collections or upgrading to M2.');
            await c.close();
          })().catch(e => { console.error(e); process.exit(1); });
          "
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
