# UniCoach public website — nginx config for the production container.
# Copied to /etc/nginx/conf.d/default.conf, i.e. it is included inside nginx's http {} block.
# HTTPS is terminated by Coolify's proxy (Traefik); this server only speaks plain HTTP on port 80
# inside the Docker network.

# Cache policy per URL. Decided here in one place so the security headers below are never lost
# (an add_header inside a location block would drop every add_header of the server block).
#   /assets/<name>-<hash>.<ext>  Vite build output with a content hash -> cache 1 year, immutable
#   other static files (public/)  same file name can get new content     -> cache 1 day
#   index.html, SPA routes, robots.txt, sitemap.xml, manifest.json      -> always revalidate
map $uri $unicoach_cache_control {
    default                                                                 "no-cache";
    "~^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+$"                      "public, max-age=31536000, immutable";
    "~*\.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm|mp3|lottie|pdf)$" "public, max-age=86400";
}

# ── SEO: one canonical host ──
# Google indexed the old site as https://www.unicoach.com, so every other host we answer for
# (bare unicoach.com, and unicoach.in) is sent there with a permanent redirect.
map $host $unicoach_host_redirect {
    default             0;
    unicoach.com        1;
    unicoach.in         1;
    www.unicoach.in     1;
}

# ── SEO: old WordPress URLs (www.unicoach.com before Oct 2026) → closest new page ──
# A 301 moves each page's Google ranking to the new URL instead of turning it into a 404.
# Regexes are tried top to bottom; the first match wins.
map $uri $unicoach_legacy_redirect {
    default "";

    # Pages
    "~^/contact-us(-\d+)?/?$"                                                   /contact;
    "~^/careers/?$"                                                             /contact;
    "~^/(destinations|services)(-\d+)?/?$"                                      /study-abroad;
    "~^/unicoach-(usa|uk|canada|australia|germany|ireland|france|italy|new-zealand)/?$" /study-abroad/$1;
    "~^/unicoach-(vietnam|switzerland|sweden|spain|singapore|netherlands|mauritius|malaysia|japan|hungary|finland|dubai|denmark|czech-republic|cyprus|austria)/?$" /study-abroad;
    "~^/(undergrad|masters|ranking-accredit)[a-z-]*(-\d+)?/?$"                  /universities;
    "~^/profile(-\d+)?/?$"                                                      /universities;
    "~^/life-with-unicoach(-\d+)?/?$"                                           /unicoach;
    "~^/(pre-departure|post-arrival)(-\d+)?/?$"                                 /visa-assistance;
    "~^/sample-page/?$"                                                         /;

    # Blog index, archives and WordPress internals
    "~^/blog/?$"                                                                /blogs;
    "~^/(category|tag|author)/"                                                 /blogs;
    "~^/[0-9]{4}/"                                                              /blogs;
    "~^/(feed|comments/feed)/?$"                                                /blogs;
    "~^/(wp-admin|wp-login\.php|wp-content|wp-includes|wp-json|xmlrpc\.php)"    /;

    # Blog posts
    "~^/(do-you-know-what-is-a-gic-and-how-can-it-help-you-study-in-canada|what-to-choose-masters-or-pg-diploma-in-canada|know-about-designated-learning-institutions-dlis-in-canada|grading-system-in-canada-how-does-it-work|everything-you-need-to-know-about-project-management-course-in-canada|how-to-choose-your-province-in-canada-for-education|rejection-of-canadian-student-visas-4-big-reasons|6-reasons-to-choose-canada-for-higher-education)/?$" /study-abroad/canada;
    "~^/(universities-in-usa-with-guaranteed-international-student-housing|know-about-different-types-of-summer-programs-in-us|pathway-programs-in-usa-and-how-effective-they-are-for-your-career(-2)?|how-to-know-where-to-study-in-the-usa|types-of-student-visas-in-the-usa-and-how-to-get-them)/?$" /study-abroad/usa;
    "~^/an-international-students-guide-to-studying-in-the-united-states"      /study-abroad/usa;
    "~^/(5-reasons-to-consider-before-going-to-the-uk|4-reasons-why-uk-is-popular-education-hub-for-international-students)/?$" /study-abroad/uk;
    "~^/(best-medical-science-universities-in-australia-for-international-students|best-mba-colleges-in-australia-for-international-students-2022|8-reasons-to-choose-australia-for-your-education-journey)/?$" /study-abroad/australia;
    "~^/study-in-ireland-the-land-of-saints-and-scholars/?$"                   /study-abroad/ireland;
    "~^/top-7-reasons-to-choose-germany-for-international-students/?$"         /study-abroad/germany;
    "~^/how-to-write-sop-importance-tips-and-format/?$"                        /resources/sop/statement-of-purpose;
    "~^/top-universities-waiving-gre-and-gmat-exam-in-2022/?$"                 /exams/gre;
    "~^/the-sat-is-going-digital-in-2023-heres-how-you-can-ace-it-and-get-into-top-universities/?$" /exams/sat;
    "~^/how-to-enhance-your-visa-interview-skills-to-gain-us-f-1-visa-tips/?$" /ai-tools/visa-prep;
    "~^/(ivy-league-school-admissions-how-to-build-a-strong-profile|5-ivy-league-schools-in-popular-countries-for-international-students-oxford-or-harvard)/?$" /universities;
    "~^/(how-to-bring-your-family-while-studying-abroad|10-top-skills-needed-to-become-a-data-scientist|top-humanities-courses-at-undergraduate-level|top-7-bachelors-degrees-you-can-study-abroad-in-2022|5-factors-international-students-should-keep-in-mind-to-study-abroad|know-about-transferring-schools-a-complete-guide|study-physics-in-these-top-countries)/?$" /study-abroad;

    # Any other URL with a trailing slash → same URL without it (the new site's canonical form)
    "~^(?<unicoach_no_slash>/.+)/$"                                             $unicoach_no_slash;
}

server {
    listen 80;
    server_name _;

    # Canonical host first, then old-site URLs (both permanent)
    if ($unicoach_host_redirect) {
        return 301 https://www.unicoach.com$request_uri;
    }
    if ($unicoach_legacy_redirect) {
        return 301 $unicoach_legacy_redirect;
    }

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;      # do not advertise the nginx version
    absolute_redirect off;  # keep redirects relative (we sit behind an HTTPS proxy)

    # ── Gzip compression (text/html is always compressed when gzip is on) ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml application/manifest+json application/rss+xml
               image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    # ── Headers for every response (no location below uses add_header, so these always apply) ──
    add_header Cache-Control           $unicoach_cache_control;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    # Microphone stays allowed for our own pages: AI Visa Interview Prep uses speech recognition
    add_header Permissions-Policy      "camera=(), geolocation=(), microphone=(self)" always;

    # Container health check used by Docker / Coolify (see Dockerfile HEALTHCHECK)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Build output: serve the real file or a real 404, never index.html. After a new deploy an old
    # chunk name then fails cleanly and the app's vite:preloadError handler reloads the page.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # Missing images/fonts/scripts get a 404 instead of the HTML page
    location ~* \.(?:js|mjs|css|map|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm|mp3|json|lottie|pdf|txt|xml|webmanifest)$ {
        try_files $uri =404;
    }

    # React Router support — sabhi URLs pe index.html serve karo (SPA fallback).
    # No "$uri/" on purpose: public/ has folders like /events that are also app routes.
    location / {
        try_files $uri /index.html;
    }
}
