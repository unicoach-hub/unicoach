# UniCoach Admin Panel — nginx config for the production container.
# Copied to /etc/nginx/conf.d/default.conf, i.e. it is included inside nginx's http {} block.
# HTTPS is terminated by Coolify's proxy (Traefik); this server only speaks plain HTTP on port 80
# inside the Docker network.

# Cache policy per URL. Decided here in one place so the security headers below are never lost
# (an add_header inside a location block would drop every add_header of the server block).
#   /assets/<name>-<hash>.<ext>  Vite build output with a content hash -> cache 1 year, immutable
#   other static files (public/)  same file name can get new content     -> cache 1 day
#   index.html and SPA routes                                          -> always revalidate
map $uri $unicoach_admin_cache_control {
    default                                                                 "no-cache";
    "~^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+$"                      "public, max-age=31536000, immutable";
    "~*\.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot)$"           "public, max-age=86400";
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;      # do not advertise the nginx version
    absolute_redirect off;  # keep redirects relative (we sit behind an HTTPS proxy)

    # ── Gzip compression (text/html is always compressed when gzip is on) ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml application/manifest+json
               image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    # ── Headers for every response (no location below uses add_header, so these always apply) ──
    add_header Cache-Control           $unicoach_admin_cache_control;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header Permissions-Policy      "camera=(), geolocation=(), microphone=()" always;
    # The admin panel must never appear in search results
    add_header X-Robots-Tag            "noindex, nofollow, noarchive, nosnippet" always;

    # Container health check used by Docker / Coolify (see Dockerfile HEALTHCHECK)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Build output: serve the real file or a real 404, never index.html
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # Missing images/fonts/scripts get a 404 instead of the HTML page
    location ~* \.(?:js|mjs|css|map|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|json|txt|xml|webmanifest)$ {
        try_files $uri =404;
    }

    # React Router support (SPA fallback)
    location / {
        try_files $uri /index.html;
    }
}
